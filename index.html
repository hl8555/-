<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>성인 사회정서역량 테스트</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%230f766e'/></svg>"
    />
  </head>
  <body>
    <div class="wrap">
      <div class="topbar">
        <div class="brand"><span class="dot"></span>사회정서역량 테스트</div>
        <a class="link" href="/admin.html">관리자</a>
      </div>

      <section id="view-intro">
        <h1>성인 사회정서역량 테스트</h1>
        <p class="lede">
          아래 안내에 따라 소속과 이름을 입력한 뒤 검사를 시작해 주세요.
        </p>
        <p class="source">
          출처: 성인 사회정서역량 척도 (오은혜, 최윤정, 신태섭, 2022)
        </p>

        <div class="card">
          <form id="form-intro" novalidate>
            <div class="field">
              <label for="affiliation">소속</label>
              <input
                type="text"
                id="affiliation"
                name="affiliation"
                autocomplete="organization"
                placeholder="예) OO회사 인사팀, OO대학교"
                required
              />
            </div>
            <div class="field">
              <label for="name">이름</label>
              <input
                type="text"
                id="name"
                name="name"
                autocomplete="name"
                placeholder="예) 홍길동"
                required
              />
            </div>
            <p class="error" id="intro-error" role="alert"></p>
            <button type="submit" class="btn btn-primary">검사 시작하기</button>
          </form>
        </div>
      </section>

      <section id="view-test" class="hidden">
        <div class="progress">
          <div class="progress-track">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
          <div class="progress-label" id="progress-label">0 / 0 문항 응답</div>
        </div>

        <h1>문항에 응답해 주세요</h1>
        <p class="lede">
          각 문항이 자신에게 얼마나 해당하는지 가장 가까운 것을 골라 주세요.
        </p>

        <div class="card">
          <form id="form-test" novalidate>
            <div id="questions"></div>
            <p class="error" id="test-error" role="alert"></p>
            <div style="display: flex; gap: 10px; margin-top: 20px">
              <button type="button" class="btn btn-ghost" id="btn-back">
                이전으로
              </button>
              <button type="submit" class="btn btn-primary" id="btn-submit">
                제출하고 점수 보기
              </button>
            </div>
          </form>
        </div>
      </section>

      <section id="view-result" class="hidden">
        <h1>검사가 완료되었습니다</h1>
        <p class="lede">응답해 주셔서 감사합니다. 아래는 나의 합산 점수입니다.</p>

        <div class="card">
          <div class="result">
            <div class="result-name" id="result-name"></div>
            <div>
              <span class="result-score" id="result-score">0</span
              ><span class="result-max" id="result-max"> / 50점</span>
            </div>
            <div class="result-bar">
              <div class="result-fill" id="result-fill"></div>
            </div>
            <p class="result-hint">
              점수가 높을수록 사회정서역량이 높음을 의미합니다.
            </p>
            <button type="button" class="btn btn-ghost" id="btn-restart">
              처음으로 돌아가기
            </button>
          </div>
        </div>
      </section>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
