<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>관리자 · 사회정서역량 통계</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%230f766e'/></svg>"
    />
  </head>
  <body>
    <div class="wrap">
      <div class="topbar">
        <div class="brand"><span class="dot"></span>관리자 대시보드</div>
        <a class="link" href="/">테스트 화면</a>
      </div>

      <section id="view-login">
        <h1>관리자 확인</h1>
        <p class="lede">결과를 보려면 관리자 암호를 입력해 주세요.</p>

        <div class="card" style="max-width: 360px">
          <form id="form-login" novalidate>
            <div class="field">
              <label for="password">암호</label>
              <input
                type="password"
                id="password"
                name="password"
                inputmode="numeric"
                autocomplete="off"
                placeholder="암호 입력"
                required
              />
            </div>
            <p class="error" id="login-error" role="alert"></p>
            <button type="submit" class="btn btn-primary" id="btn-login">
              확인
            </button>
          </form>
        </div>
      </section>

      <section id="view-dash" class="hidden">
        <h1>사회정서역량 통계</h1>
        <p class="lede">전체 응답자의 통계 요약입니다.</p>

        <div class="stat-grid">
          <div class="stat">
            <div class="stat-label">전체 응답자 수</div>
            <div class="stat-value" id="stat-count">0<small> 명</small></div>
          </div>
          <div class="stat">
            <div class="stat-label">총점 평균</div>
            <div class="stat-value">
              <span id="stat-avg">0</span
              ><small> / <span id="stat-max">50</span>점</small>
            </div>
          </div>
        </div>

        <div class="section-title">문항별 평균 점수</div>
        <div class="card">
          <div id="per-question"></div>
        </div>

        <div class="section-title">개별 총점</div>
        <div class="tbl-wrap">
          <table id="individuals">
            <thead>
              <tr>
                <th>소속</th>
                <th>이름</th>
                <th>총점</th>
                <th>응답 일시</th>
              </tr>
            </thead>
            <tbody id="individuals-body"></tbody>
          </table>
        </div>

        <div class="dash-actions">
          <button type="button" class="btn btn-ghost" id="btn-refresh">
            새로고침
          </button>
          <button type="button" class="btn btn-danger" id="btn-reset">
            응답 전체 초기화
          </button>
        </div>
        <p class="reset-msg" id="reset-msg" role="status"></p>
        <p class="reset-hint">
          초기화하면 지금까지의 모든 응답이 삭제되고, 이후 접수되는 응답부터 새로
          집계됩니다. 삭제된 데이터는 되돌릴 수 없습니다.
        </p>
      </section>
    </div>

    <script src="/admin.js"></script>
  </body>
</html>
